<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; frame-src https:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Art · Hideaki Bell</title>
  <meta name="description" content="Art area of Hideaki Bell — digital illustration, concept art and abstract works." />
  <meta name="author" content="Hideaki Bell" />
  <meta name="robots" content="index, follow" />

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />

  <!-- Anti-FOUC: apply saved theme BEFORE CSS renders -->
  <script src="assets/js/theme-init.js"></script>

  <!-- Styles: single entry point (ARCcC §2.3) -->
  <link rel="stylesheet" href="assets/styles/index.css" />
</head>
<body data-page="art">

  <!-- Custom cursor (cosmetic layer, not a module) -->
  <div class="cursor-dot"  aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <!-- ───────────────────────────────────────────────────────
       NAVIGATION (same shell on every page)
  ─────────────────────────────────────────────────────────── -->
  <nav class="site-nav" role="navigation" aria-label="Main navigation">
    <a href="index.html" class="nav__logo" id="nav-logo">
      Hideaki <span>Bell</span>
    </a>

    <ul class="nav__links" role="list">
      <li><a href="index.html"  class="nav__link" id="nav-link-home">Home</a></li>
      <li><a href="art.html"    class="nav__link" id="nav-link-art" aria-current="page">Art</a></li>
      <li><a href="studio.html" class="nav__link" id="nav-link-studio">Software</a></li>
      <li><a href="about.html"   class="nav__link" id="nav-link-about">About</a></li>
      <li><a href="contact.html" class="nav__link" id="nav-link-contact">Contact</a></li>
    </ul>

    <div class="nav__right">
      <button class="lang-switch" id="lang-switch-btn" aria-label="Switch language" title="Mudar idioma">
        EN
      </button>

      <a href="admin.html" class="admin-link-btn" id="admin-link-btn" title="Creator Studio" style="display:none;">
        ⚙
      </a>

      <button class="theme-toggle" id="theme-toggle-btn" aria-label="Switch to light mode" title="Light mode">
        <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>

      <button class="nav__burger" aria-label="Toggle mobile menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- ───────────────────────────────────────────────────────
       ART AREA — dedicated page (gallery, filters, lightbox)
  ─────────────────────────────────────────────────────────── -->
  <main class="area">
    <header class="area__header">
      <p class="area__eyebrow" data-i18n="hub_art_title">Art Area</p>
      <p class="area__intro"  data-i18n="hub_art_text">
        Illustrations, concept art and personal pieces.
      </p>
    </header>

    <section id="gallery" aria-label="Portfolio gallery">
      <div class="section-header reveal">
        <span class="section-label">Portfolio</span>
        <h2 class="section-title">Selected Works</h2>
        <div class="section-divider" aria-hidden="true"></div>
      </div>

      <!-- Gallery toolbar with filters and NSFW toggle -->
      <div class="gallery__toolbar reveal reveal-delay-1">
        <div class="gallery__filters" id="gallery-filters" role="tablist" aria-label="Gallery filters">
          <!-- Injected by GalleryFilter -->
        </div>

        <div class="nsfw-toggle-container">
          <label class="nsfw-switch" for="nsfw-checkbox">
            <input type="checkbox" id="nsfw-checkbox" />
            <span class="nsfw-slider"></span>
          </label>
          <span class="nsfw-text">Show NSFW (18+)</span>
        </div>
      </div>

      <!-- Artwork grid (populated by GalleryRenderer) -->
      <div class="gallery__grid" id="gallery-grid" role="list" aria-label="Artwork gallery">
        <!-- Injected by GalleryRenderer -->
      </div>

      <div class="gallery__actions reveal" style="text-align:center;margin-top:var(--space-12);">
        <button class="btn-secondary" id="gallery-load-more" style="display:none;">Load More</button>
      </div>
    </section>

    <!-- Cross-area navigation -->
    <nav class="area__switch" aria-label="Other areas">
      <a class="area__switch-link" href="index.html" data-i18n="back_home">Back to home</a>
      <a class="area__switch-link" href="studio.html" data-i18n="hub_studio_cta">Enter the software area</a>
    </nav>
  </main>

  <!-- ──────────────────────────────────────────────────────
       FOOTER
  ─────────────────────────────────────────────────────────── -->
  <footer class="site-footer" role="contentinfo">
    <p class="site-footer__text">
      © <span id="footer-year"></span> Hideaki Bell · All Rights Reserved ·
      Built with ❤ using <a href="#" aria-label="ARCcC methodology">ARCcC</a>
    </p>
  </footer>

  <!-- ───────────────────────────────────────────────────────
       SCRIPTS — Loaded in dependency order (ARCcC §2.3)
  ─────────────────────────────────────────────────────────── -->

  <!-- 1. Infrastructure (no deps) -->
  <script src="infrastructure/event-bus/index.js"></script>
  <script src="infrastructure/i18n/index.js"></script>
  <script src="infrastructure/config/index.js"></script>
  <script src="infrastructure/content/index.js"></script>
  <script src="infrastructure/intersection-observer/index.js"></script>

  <!-- 2. Utils (no deps) -->
  <script src="utils/dom/index.js"></script>
  <script src="utils/formatters/index.js"></script>
  <script src="utils/env/index.js"></script>

  <!-- 3. Core — Contracts (no deps) -->
  <script src="core/gallery/public/types/ArtworkTypes.js"></script>

  <!-- 4. Core — Gallery sub-modules -->
  <script src="core/gallery/private/age-gate/index.js"></script>
  <script src="core/gallery/private/renderer/index.js"></script>
  <script src="core/gallery/private/lightbox/index.js"></script>
  <script src="core/gallery/private/filter/index.js"></script>
  <script src="core/gallery/index.js"></script>

  <!-- 5. Core — Creator Studio gate -->
  <script src="core/admin-gate/index.js"></script>

  <!-- 6. Core — Theme Toggle -->
  <script src="core/theme-toggle/index.js"></script>

  <!-- 7. Core — Language Switch -->
  <script src="core/language/index.js"></script>

  <!-- 8. Boundary — Contracts + Orchestrator + Entry point -->
  <script src="boundary/orchestrator/contracts/SiteContract.js"></script>
  <script src="boundary/orchestrator/index.js"></script>
  <script src="boundary/index.js"></script>

</body>
</html>
