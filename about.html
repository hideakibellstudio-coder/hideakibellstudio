    <section id="about" class="about-page" aria-label="About the artist">

        <span class="section-label">About</span>
        <h2 class="section-title">The Artist</h2>
        <div class="section-divider" aria-hidden="true"></div>
      </div>

      <div class="about__inner">
        <div class="about__visual reveal-left">
          <div class="about__avatar-wrapper">
            <img class="about__avatar" id="about-avatar"
                 src="assets/images/avatar.jpg"
                 alt="Hideaki Bell — digital artist" loading="lazy" />
            <div class="about__avatar-frame" aria-hidden="true"></div>
          </div>
        </div>

        <div class="about__content reveal-right">
          <div class="about__bio" id="about-bio"><!-- Injected by AboutRenderer --></div>
          <div class="about__specialties" id="about-specialties"><!-- Injected by AboutRenderer --></div>
          <div class="about__stats" aria-label="Career statistics">
            <div class="stat-item">
              <div class="stat-item__number" id="about-stat-years">7<span>+</span></div>
              <div class="stat-item__label">Years Creating</div>
            </div>
            <div class="stat-item">
              <div class="stat-item__number" id="about-stat-projects">120<span>+</span></div>
              <div class="stat-item__label">Projects</div>
            </div>
            <div class="stat-item">
              <div class="stat-item__number" id="about-stat-clients">40<span>+</span></div>
              <div class="stat-item__label">Clients</div>
            </div>
          </div>
        </div>
      </div>
